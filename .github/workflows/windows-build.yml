name: Windows executable
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --clean --noconfirm --onefile --name HonorBoot launcher.py
      - name: Package portable application
        shell: pwsh
        run: |
          Copy-Item README.md,LICENSE,NOTICE dist/
          Compress-Archive -Path dist/* -DestinationPath HonorBoot-Windows-x64.zip
          (Get-FileHash HonorBoot-Windows-x64.zip -Algorithm SHA256).Hash.ToLower() + '  HonorBoot-Windows-x64.zip' | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HonorBoot-Windows-x64
          path: |
            HonorBoot-Windows-x64.zip
            SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HonorBoot-Windows-x64
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" HonorBoot-Windows-x64.zip SHA256SUMS.txt --verify-tag --prerelease --title "HonorBoot $TAG (experimental)" --notes "Portable Windows x64 build. Extract and open HonorBoot.exe. Python is included; official Android platform-tools and device drivers must be installed separately. Read README before starting: an accepted unlock command may erase data. Simulated tests are not a hardware compatibility guarantee."
